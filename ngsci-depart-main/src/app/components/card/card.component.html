@if (show=='front') {
<mat-card class="infinite-card">
  <mat-card-header>
    <div mat-card-avatar class="infinite-card-mana-cost">
      {{card?.cost}} <i class="fas fa-gem"></i>
    </div>
    <mat-card-title>{{card?.name}}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="infinite-card-content" style="background-image: url({{card?.imageUrl}});">
    <table style="font-size: 2em; width: fit-content; text-shadow: 2px 2px 2px black;">
      <tr>
        <td><i class="fas fa-fist-raised"></i></td>
        <td>{{card?.attack}}</td>
      </tr>
      <tr>
        <td [class.wobble-hor-bottom]="css_wobbleBottom">
          <i class="fas fa-shield-alt"></i>
        </td>
        <td>{{card?.health}}</td>
      </tr>

      <ng-container *ngIf="card?.CardPowers?.length!! > 0">
        <tr *ngFor="let cp of card?.CardPowers; let i = index">
          <td>
            <i class="{{ cp.power.icone }}" [ngClass]="animatedPowerIndex === i ? animationClass : ''"
              (click)="doubleCenterSpin(i)" style="cursor: pointer;"></i>
          </td>
          <td>{{ cp.value }}</td>
        </tr>
      </ng-container>
    </table>
  </mat-card-content>
</mat-card>
}

@if (show=='back') {
<mat-card class="infinite-card" style="background-image: url({{beautifulBackUrl}});">
</mat-card>
}
