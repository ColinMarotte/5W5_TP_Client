@if (show=='front') {
      
      <mat-card class="infinite-card" [@trigger] = "animatedIndex" >
    <mat-card-header [ngStyle]="{'background-color': getRarityColor(card.rarity)}">
      <div mat-card-avatar class="infinite-card-mana-cost">
        {{card.cost}} <i class="fas fa-gem"></i>
      </div>
      <mat-card-title>{{card.name}}</mat-card-title>
      <mat-card-subtitle>{{getRarityName(card.rarity)}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="infinite-card-content" style="background-image: url({{card.imageUrl}});">
      <table class="infinite-card-powers">
        <tr *ngFor="let cp of card.cardPowers; let i = index">
          <td title="{{ cp.power.name }}" [@firstStrike]="cp.power.name === 'First Strike' ? animationCounters[i] : 0"
            [@thorns]="cp.power.name === 'Thorns' ? animationCounters[i] : 0"
            [@heal]="cp.power.name === 'Heal' ? animationCounters[i] : 0"
            [@shield]="cp.power.name === 'Shield' ? animationCounters[i] : 0" (click)="playAllPowerAnimations()"
            style="cursor: pointer;">
            {{ cp.power.icone }}
          </td>
          <td *ngIf="cp.power.name != 'First Strike'">{{ cp.value }}</td>
        </tr>
      </table>
  
    <table class="infinite-card-stats">
        <tr>
          <td><i class="fas fa-fist-raised"></i></td>
          <td>{{card.attack}}</td>
        </tr>
        <tr>
          <td><i class="fas fa-shield-alt"></i></td>
          <td>{{oldHealth != 0 ? oldHealth : card.health}}</td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
  }
  
  @if (show=='back') {
  <mat-card class="infinite-card" style="background-image: url({{beautifulBackUrl}});">
  </mat-card>
  }
