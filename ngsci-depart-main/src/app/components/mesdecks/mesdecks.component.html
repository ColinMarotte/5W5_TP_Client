<div class="container-fluid">

  <div class="row">
    <div class="col">
      <button mat-raised-button color="primary" style="padding: 30px;" (click)="openDialog()" [disabled]="isNbDeckMaxReached()">
        <mat-icon>add</mat-icon> Ajouter un deck
      </button>
    </div>
  </div>

  <div class="row align-items-center" *ngIf="isNbDeckMaxReached()">
    <mat-icon class="info">info</mat-icon>
    Vous possédez le nombre maximal de decks!
  </div>

  <br>

  <app-deck *ngFor="let deck of mesDecks" [deck]="deck"></app-deck>

</div>
