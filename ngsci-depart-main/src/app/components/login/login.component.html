<div
  style="width: 100%;height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column">
  <mat-card class="artist-card" style="margin: 16px; padding: 16px;">

    <mat-card-header><mat-icon>login</mat-icon>Connexion</mat-card-header>

    <form [formGroup]="form">

      <mat-card-content>

        <mat-form-field style="width: 100%">
          <mat-label>Courriel</mat-label>
          <input matInput [(ngModel)]="emailInput" type="email" formControlName="email" name="email" required/>

          <mat-error *ngIf="form.get('email')?.hasError('required')">
            Le courriel est <strong>requis</strong>.
          </mat-error>
        </mat-form-field>

        <mat-form-field style="width: 100%">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" [(ngModel)]="passwordInput" formControlName="password" name="password" required/>
          <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
            
          <mat-error *ngIf="form.get('password')?.hasError('required')">
            Le mot de passe est <strong>requis</strong>.
          </mat-error>
        </mat-form-field>

      </mat-card-content>

      <mat-card-footer>

        <div style="color: #db3f23;">
          {{reponse}}
        </div>
          
        <br>

        <button mat-raised-button color="accent" (click)="login()" [disabled]="!form.valid">
          Se connecter
        </button>
        <br>
        <br>
        <button mat-raised-button color="primary" (click)="toRegister()">
          Créer un compte
        </button>

      </mat-card-footer>

    </form>

  </mat-card>
</div>
